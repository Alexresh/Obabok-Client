plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = rootProject.o_base_version
group = rootProject.maven_group

base {
    archivesName = 'o-base'
}

repositories {
    maven {
        url = 'https://jitpack.io'
    }
}


loom {
    mods {
        "o-base" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            getProgramArguments().add("--username")
            getProgramArguments().add("ObabokIde")
        }
    }
    runConfigs.configureEach {
        getGenerateRunConfig().set(true)
    }

}
def moduleRoots = ['modules', 'extra'].collect { rootProject.file(it).toPath() }
def moduleProjects = rootProject.subprojects.findAll { mod ->
    mod != project && moduleRoots.any { mod.projectDir.toPath().startsWith(it) }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    include(implementation(project(":oui")))
    include(implementation(project(":o-client")))

    moduleProjects.each { mod ->
        include(implementation(project(mod.path)))
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

jar {
    archiveAppendix = minecraft_version
    from(rootProject.file("LICENSE")) {
        rename { "${it}" }
    }
}

