plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = o_client_version
group = rootProject.maven_group

base {
	archivesName = 'o-client'
}

/*repositories {
	maven {
		url = 'https://jitpack.io'
	}
}*/

loom {
	mods {
		"o-client" {
			sourceSet sourceSets.main
		}
	}
	runConfigs.configureEach {
		getGenerateRunConfig().set(false)
	}
}

afterEvaluate {
	def mixinJar = configurations.compileClasspath.find { it.name.contains("sponge-mixin") }
	if (mixinJar != null) {
		loom.runs.client.getJvmArguments().add("-javaagent:${mixinJar.absolutePath}")
	}
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	implementation("net.fabricmc:fabric-loader:${loader_version}")
	implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

	implementation(project(":oui"))
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	archiveAppendix = minecraft_version
}
